name: genecat
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.13
  - pip
  - numpy
  - pandas
  - polars
  - scikit-learn
  - matplotlib
  - matplotlib-venn
  - tqdm
  - requests
  - beautifulsoup4
  - rich
  - openpyxl
  - pyarrow
  - statsmodels

  # bioinfo stuff
  - biopython
  - reportlab
  - ete4
  - diamond=2.1.24

  - pip:
      - pyorthoani
      - gb-io
      - cblaster
      - gecco-tool
